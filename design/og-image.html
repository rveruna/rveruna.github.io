<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Link preview image</title>
    <style>
      /* The 1200 by 630 picture shown when the site is shared. Open this file in a browser and screenshot the page. */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #fff6e8;
        color: #1d1730;
        font-family:
          ui-rounded,
          'SF Pro Rounded',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      .circle {
        position: absolute;
        border-radius: 50%;
        opacity: 0.85;
      }
      .sun {
        width: 400px;
        height: 400px;
        right: 40px;
        top: 120px;
        background: #ffc83d;
      }
      .mint {
        width: 220px;
        height: 220px;
        right: 330px;
        top: 200px;
        background: #2bd3a0;
        opacity: 0.7;
      }
      .coral {
        width: 190px;
        height: 190px;
        right: 150px;
        bottom: 30px;
        background: #ff5a4e;
        opacity: 0.8;
      }
      main {
        position: absolute;
        left: 80px;
        top: 80px;
        right: 80px;
        bottom: 70px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .mark {
        font-size: 56px;
        font-weight: 800;
        line-height: 1;
      }
      .mark span {
        color: #ff5a4e;
      }
      h1 {
        margin: 0;
        font-size: 140px;
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -4px;
      }
      .role {
        margin: 0 0 22px;
        font-size: 34px;
        font-weight: 700;
      }
      .url {
        margin: 0;
        font-size: 28px;
        color: #5a5170;
      }
    </style>
  </head>
  <body>
    <div class="circle sun"></div>
    <div class="circle mint"></div>
    <div class="circle coral"></div>
    <main>
      <div class="mark">v<span>.</span></div>
      <div>
        <p class="role">Frontend engineer · React Native &amp; React · Edinburgh</p>
        <h1>Veronika<br />Rosicova</h1>
      </div>
      <p class="url">rveruna.github.io</p>
    </main>
  </body>
</html>
